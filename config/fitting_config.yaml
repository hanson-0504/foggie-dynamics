      min_scale: 0.15
      max_scale: 1.0
    bounds:
      log10_rho01: [3.0, 8.0]
      log10_rho02: [0.0, 7.0]
      R_d1: [0.1, 10.0]
      R_d2: [5.0, 30.0]
      z_0: [0.1, 3.0]
      log10_z0: [-2.0, 0.7]
      log_sigma: [-6, 1]
      A: [-10.0, 10.0]
      B: [-10.0, 10.0]
    p0:
      log10_rho01: 7.0
      log10_rho02: 5.0
      R_d1: 3.0
      R_d2: 15.0
      z_0: 1.0
      log10_z0: 0.0
      A: 0.25
      B: 1.0
    models:
      - Single-Exponential
      - Double-Exponential
      - Single-Disk-Flaring
      - Double-Disk-Flaring
    fitting:
      nwalkers: 128
      nsteps: 50000
  halo:
    enabled: True
    r_range: [25.0, 250.0]  # Range at z=0 in kpc
    range_scaling:
      mode: "linear"
      min_scale: 0.1
      max_scale: 1.0
    bounds:
      log10_rho0: [1.0, 6.0]
      log10_rs: [0.5, 3.0]
      alpha: [0.0, 5.0]
      beta: [0.0, 8.0]
      log_sigma: [-6, 1]
    p0:
      log10_rho0: 4.0
      log10_rs: 1.5
      alpha: 1.0
      beta: 3.0
    models:
      - NFW
      - Two-Power
    fitting:
      nwalkers: 128
